# ─────────────────────────────────────────────────────────────
#  Bundled (bootstrap) base URLs — readable here on purpose.
#
#  At build time these values are XOR'd + base64 encoded and injected into
#  BuildConfig as *_ENC fields, so the shipped APK contains no plain-text
#  host. The app decodes them at runtime (RemoteConfig.decodeXor).
#
#  primary   = the front the app tries first
#  secondary = the front it retries on when the primary fails
# ─────────────────────────────────────────────────────────────
primary.base=https://blazemovies.badman993944.workers.dev/v1/
secondary.base=https://blazemovies.bkstudy8565.workers.dev/v1/
